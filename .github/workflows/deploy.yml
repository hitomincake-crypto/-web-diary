name: Update deploy.json

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate deploy.json
        run: |
          echo "{\"updatedAt\":\"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"}" > deploy.json

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add deploy.json

          git diff --cached --quiet || git commit -m "auto: update deploy.json"

          git push
